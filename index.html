<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bikewatching</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="global.css" />
</head>
<body>
  <div id="map"><svg></svg></div>

  <header class="topbar">
    <h1>🚴🏼‍♀️ Bikewatching</h1>
    <div class="controls">
      <button id="play-btn" aria-label="Play">▶</button>
      <input type="range" id="time-slider" min="-1" max="1440" value="-1" />
      <span class="time-readout">
        <time id="selected-time"></time>
        <em id="any-time">any time</em>
      </span>
    </div>
  </header>

  <div class="legend" aria-label="Departure/arrival balance legend">
    <span class="legend-title">Flow</span>
    <div class="legend-item" style="--departure-ratio: 1">More departures</div>
    <div class="legend-item" style="--departure-ratio: 0.5">Balanced</div>
    <div class="legend-item" style="--departure-ratio: 0">More arrivals</div>
  </div>

  <div id="tooltip" role="tooltip"></div>
  <aside id="station-panel" aria-live="polite"></aside>

  <div id="loading"><div class="spinner"></div><p>Loading a month of Bluebikes trips…</p></div>
  <div id="toast" role="alert"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
